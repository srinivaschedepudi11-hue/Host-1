<html>
    <head>
        <title>css selectors</title>
        <style>
        * {
            font-family: Arial, sans-serif;
        }

        body {
            color: #e84545;
            font-size: 16px;
        }

        p {
            color: #e68510;
            padding: 2px 5px;
        }

        #main-title,h2 {
            color: #0f1112;
        }
    </style>
    </head>
     <body>
        <header>
        <h1>CSS Selectors</h1>
        <p>There are mainly four types of CSS selectors:</p>
        </header>
        <div>
            <ul>
                <li>1. Universal Selector</li>
                <li>2. Type Selector</li>
                <li>3. Class Selector</li>
                <li>4. ID Selector</li>
            </ul>
        </div>
       <p>example of universal selector:</p> 
       <h1 id="main-title">This is a heading with an ID</h1>
       <h2 class="sub-title">This is a sub-heading with a class</h2>
       <h3 element="heading">This is a heading with an element attribute</h3>
     </body>
</html>
